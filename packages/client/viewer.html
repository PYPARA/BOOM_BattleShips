<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>模型对照</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1d2228; color: #e6edf2; font: 14px/1.5 system-ui, sans-serif; }
      header { display: flex; gap: 8px; align-items: center; padding: 10px 14px; flex-wrap: wrap; }
      header button {
        background: #2d343c; color: inherit; border: 1px solid #46505a; border-radius: 6px; padding: 5px 12px; cursor: pointer;
      }
      header button[aria-pressed="true"] { background: #3f7fe0; border-color: #3f7fe0; }
      .sep { width: 1px; height: 22px; background: #46505a; margin: 0 6px; }
      main { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; padding: 0 14px 14px; max-width: 1400px; }
      figure { margin: 0; position: relative; background: #dedede; border-radius: 8px; overflow: hidden; aspect-ratio: 1; }
      figure img, figure canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
      figcaption { position: absolute; left: 10px; top: 8px; color: #333; font-size: 12px; }
    </style>
  </head>
  <body>
    <header id="controls"></header>
    <main>
      <figure><img id="concept" alt="概念图" /><figcaption>概念图</figcaption></figure>
      <figure id="stage"><figcaption>Three.js 模型</figcaption></figure>
    </main>
    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
