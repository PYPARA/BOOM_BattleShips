<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOOM 海战</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b1d2a; overflow: hidden; user-select: none; }
      #app { position: fixed; inset: 0; }
      .panel {
        position: fixed; font: 13px/1.5 system-ui, sans-serif; color: #e6f1f7;
        text-shadow: 0 1px 2px #000a; pointer-events: none; white-space: pre;
      }
      #hud { left: 12px; top: 10px; }
      #help { right: 12px; top: 10px; text-align: right; opacity: 0.7; font-size: 12px; }
      .minimap {
        position: fixed; left: 12px; bottom: 12px; width: 220px; height: 220px;
        border: 2px solid #0008; border-radius: 4px; cursor: pointer;
      }
      .overlay { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      :root {
        --panel: linear-gradient(180deg, #1a2a38f2, #0d1720f2); --edge: #c9a25a66; --edge-strong: #e2bd70;
        --text: #e9f1f6; --dim: #93a9b8; --gold: #ffd25a; --up: #7dff8a; --down: #ff7a6a;
        --south: #5aa0ff; --north: #ff6a5a;
      }
      .hud-panel { background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; box-shadow: 0 4px 18px #0008, inset 0 1px 0 #ffffff14; color: var(--text); }
      .topbar {
        position: fixed; left: 50%; top: 8px; transform: translateX(-50%); display: flex; gap: 18px; align-items: center;
        padding: 5px 16px; background: var(--panel); border: 1px solid var(--edge); border-radius: 0 0 10px 10px;
        color: var(--text); font: 600 15px system-ui, sans-serif; box-shadow: 0 4px 14px #0007; pointer-events: none; white-space: nowrap;
      }
      .topbar .gold { color: var(--gold); }
      .topbar .gold::before { content: ''; display: inline-block; width: 12px; height: 12px; margin-right: 6px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3b0, #e0a320 60%, #8a5a08); vertical-align: -1px; }
      .topbar .score { font-size: 18px; }
      .topbar .south, .scoreboard .south { color: var(--south); }
      .topbar .north, .scoreboard .north { color: var(--north); }
      .topbar .clock, .topbar .kd { color: var(--dim); font-weight: 500; }
      .topbar .tod { color: #ffe08a; font-weight: 500; font-size: 13px; }
      .respawn {
        position: fixed; left: 50%; top: 30%; transform: translateX(-50%); display: none; padding: 10px 22px; border-radius: 8px;
        background: #000a; color: #ffb3a8; font: 600 20px system-ui, sans-serif; pointer-events: none;
      }
      .respawn.show { display: block; }
      .toast {
        position: fixed; left: 50%; top: 52px; transform: translateX(-50%); padding: 6px 14px; border-radius: 6px;
        background: #1d2a36ee; border: 1px solid var(--edge); color: #fff; font: 14px system-ui, sans-serif; opacity: 0; transition: opacity 0.2s; pointer-events: none;
      }
      .toast.show { opacity: 1; }
      .banner {
        position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); display: none; padding: 18px 36px;
        border-radius: 10px; font: bold 30px system-ui, sans-serif; color: #fff; background: #000b; border: 1px solid var(--edge-strong);
      }
      .banner.show { display: block; }
      .banner.win { color: var(--gold); }
      .banner.lose { color: var(--down); }

      /* Icons: the picture covers its text fallback once it loads. */
      .icon { position: relative; display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 6px; overflow: hidden; background: #24384a; flex: none; }
      .icon em { font: normal 600 11px/1.15 system-ui, sans-serif; color: var(--dim); text-align: center; padding: 2px; }
      .icon i { position: absolute; inset: 0; background: center / cover no-repeat; }
      .icon.mini { width: 22px; height: 22px; border-radius: 4px; vertical-align: middle; }
      .icon.mini em { font-size: 8px; }

      /* Bottom command panel. */
      .command {
        position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); display: flex; align-items: stretch; gap: 10px;
        padding: 8px 10px; background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; box-shadow: 0 6px 22px #000a;
        color: var(--text); font: 12px/1.3 system-ui, sans-serif; max-width: calc(100vw - 480px);
      }
      .command button { font: inherit; color: inherit; cursor: pointer; }
      .command .hero { display: flex; gap: 8px; align-items: center; }
      .command .portrait { position: relative; cursor: pointer; }
      .command .portrait:hover .icon { filter: brightness(1.2); }
      .command .portrait .icon { width: 64px; height: 64px; border: 1px solid var(--edge-strong); }
      .command .portrait .lv {
        position: absolute; right: -4px; bottom: -4px; min-width: 20px; height: 20px; padding: 0 3px; border-radius: 10px; display: grid; place-items: center;
        background: #2b1c08; border: 1px solid var(--edge-strong); color: var(--gold); font-weight: 700; font-size: 12px;
      }
      .command .vitals { width: 190px; display: flex; flex-direction: column; gap: 3px; }
      .command .name { font-weight: 700; font-size: 14px; }
      .command .name small { margin-left: 6px; color: var(--dim); font-weight: 400; font-size: 11px; }
      .command .bar { position: relative; height: 14px; border-radius: 3px; background: #0008; overflow: hidden; border: 1px solid #0006; }
      .command .bar i { position: absolute; inset: 0 auto 0 0; transition: width 0.15s; }
      .command .bar.hp i { background: linear-gradient(180deg, #6fe27a, #2f9a3e); }
      .command .bar.xp { height: 10px; }
      .command .bar.xp i { background: linear-gradient(180deg, #b48cff, #6a43c9); }
      .command .bar span { position: relative; display: block; text-align: center; font-size: 10px; line-height: 14px; text-shadow: 0 1px 2px #000; }
      .command .bar.xp span { line-height: 10px; font-size: 9px; }
      .command .stats { display: flex; gap: 10px; color: var(--dim); font-size: 11px; }
      .command .skills, .command .items { display: flex; gap: 6px; align-items: flex-start; padding-left: 10px; border-left: 1px solid #ffffff14; }
      .command .items { display: grid; grid-template-columns: repeat(3, 40px); grid-auto-rows: 40px; gap: 4px; }
      .command .slot { position: relative; padding: 0; border: 1px solid #ffffff22; border-radius: 7px; background: #0006; }
      .command .skill { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; }
      .command .skill > button[data-cast] { position: relative; padding: 0; border: 1px solid var(--edge); border-radius: 7px; background: none; }
      .command .skill > button[data-cast]:hover:not([disabled]) { border-color: var(--edge-strong); box-shadow: 0 0 8px #e2bd7088; }
      .command .skill .icon { width: 52px; height: 52px; }
      .command .unlearned .icon { filter: grayscale(1) brightness(0.55); }
      .command .passive > button[data-cast] { border-style: dashed; cursor: help; }
      .command .dots { display: flex; gap: 2px; }
      .command .dots i { width: 5px; height: 5px; border-radius: 50%; background: #ffffff22; }
      .command .dots i.on { background: var(--gold); box-shadow: 0 0 3px var(--gold); }
      .command kbd { position: absolute; left: 3px; top: 2px; font: 700 10px monospace; color: #fff; text-shadow: 0 0 3px #000, 0 0 2px #000; }
      .command .cd {
        position: absolute; inset: 0; display: grid; place-items: center; border-radius: 6px; font-size: 16px; font-weight: 800; text-shadow: 0 1px 3px #000;
        background: conic-gradient(#000b calc(var(--p) * 1turn), #0003 0);
      }
      .command .learn {
        position: absolute; right: -7px; top: -9px; width: 22px; height: 22px; padding: 0; border-radius: 50%;
        border: 1px solid #b8ffbe; background: radial-gradient(circle at 35% 35%, #7de38a, #237a33); color: #fff; font-weight: 800; font-size: 14px; line-height: 1;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse { 50% { box-shadow: 0 0 10px #7dff8a; } }
      .command .item .icon { width: 38px; height: 38px; }
      .command .bought > button[data-cast] { border-color: #7dbdff88; }
      .command .charges { position: absolute; right: 2px; bottom: 1px; font: 700 10px monospace; color: var(--gold); text-shadow: 0 0 3px #000, 0 0 2px #000; }
      .command .item.empty { border-style: dashed; border-color: #ffffff18; }
      .command button.item:hover { border-color: var(--edge-strong); }
      .command button.item.active { border-color: #7dbdff88; }

      /* Selection info panel (replaces the command bar while a unit, building or shop is selected). */
      .command.hidden, .command.info { display: none; }
      .command.info.show { display: flex; flex-wrap: wrap; align-items: flex-start; width: min(860px, calc(100vw - 480px)); min-width: 420px; }
      .command.info .side.enemy { color: var(--down); } .command.info .side.neutral { color: #d8c8a0; } .command.info .side.friend { color: var(--up); }
      .command.info .bar.hp.foe i { background: linear-gradient(180deg, #ff8a6a, #b8321e); }
      .command.info .chips { display: flex; flex-wrap: wrap; gap: 3px; }
      .command.info .chips em { font-style: normal; font-size: 10px; padding: 1px 6px; border-radius: 8px; background: #ffffff14; color: #e8d8ff; }
      .command.info .statgrid { display: grid; grid-template-columns: repeat(2, minmax(110px, auto)); gap: 2px 14px; padding-left: 10px; border-left: 1px solid #ffffff14; align-content: start; }
      .command.info .statgrid div { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; }
      .command.info .statgrid span { color: var(--dim); }
      .command.info .loadout { display: flex; flex-direction: column; gap: 4px; padding-left: 10px; border-left: 1px solid #ffffff14; }
      .command.info .loadout div { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
      .command.info .loadout span:first-child { color: var(--dim); font-size: 11px; margin-right: 4px; }
      .command.info .loadout sub { font-size: 9px; color: var(--gold); margin-left: -6px; }
      .icon.small { width: 30px; height: 30px; border-radius: 5px; }
      .icon.small em { font-size: 8px; }
      .command.info .shop-head { display: flex; gap: 10px; align-items: center; width: 100%; }
      .command.info .shop-head > div:last-child { flex: 1; }
      .command.info .shop-head .icon { width: 48px; height: 48px; }
      .command.info .status { font-size: 12px; display: flex; align-items: center; gap: 8px; }
      .command.info .status .ok { color: var(--up); } .command.info .status .no { color: #ffb070; font-weight: 600; }
      .command.info .status button { padding: 2px 10px; border: 1px solid var(--edge-strong); border-radius: 5px; background: #2b1c08; color: var(--gold); font: inherit; cursor: pointer; }
      .command.info .goods { display: flex; flex-wrap: wrap; gap: 4px 12px; width: 100%; max-height: 36vh; overflow-y: auto; }
      .command.info .goods h4 { width: 100%; margin: 4px 0 0; font-size: 11px; color: var(--dim); letter-spacing: 1px; }
      .command.info .goods .grid { display: flex; flex-wrap: wrap; gap: 4px; }
      .command.info .tile { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 3px 3px 2px; border: 1px solid #ffffff1a; border-radius: 7px; background: #0005; color: inherit; font: inherit; cursor: pointer; }
      .command.info .tile .icon { width: 40px; height: 40px; }
      .command.info .tile b { font-size: 11px; color: var(--gold); }
      .command.info .tile:hover { border-color: var(--edge-strong); background: #2a3d50; }
      .command.info .tile.poor b { color: var(--down); }
      .command.info .tile.poor .icon, .command.info .tile.off .icon { filter: saturate(0.25) brightness(0.65); }
      .command.info .tile.off { cursor: not-allowed; }
      .command.info .tile.current { border-color: #7dff8a88; }
      .command.info .tile.mine { padding: 2px; }
      .shop-hint { position: fixed; left: 50%; bottom: 128px; transform: translateX(-50%); display: none; padding: 4px 12px; border-radius: 6px;
        background: #0b131ad8; border: 1px solid var(--edge); color: var(--text); font: 12px system-ui, sans-serif; pointer-events: none; }
      .shop-hint.show { display: block; }
      .shop-hint b { color: var(--gold); font-weight: 600; }

      /* Shop. */
      .shop {
        position: fixed; right: 10px; bottom: 120px; width: 312px; max-height: calc(100vh - 200px); overflow-y: auto; display: none;
        background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 8px 10px 10px; color: var(--text);
        font: 13px/1.35 system-ui, sans-serif; box-shadow: 0 6px 22px #000a;
      }
      .shop.show { display: block; }
      .shop nav { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
      .shop nav button, .shop nav span { padding: 3px 9px; border: 1px solid #ffffff1a; border-radius: 5px; background: #0005; color: var(--dim); font: inherit; font-size: 12px; cursor: pointer; }
      .shop nav .on { color: var(--gold); border-color: var(--edge-strong); background: #2b1c0888; }
      .shop h4 { margin: 8px 0 4px; font-size: 12px; color: var(--dim); font-weight: 600; letter-spacing: 1px; }
      .shop .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
      .shop .tile { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 3px 0 2px; border: 1px solid #ffffff1a; border-radius: 7px; background: #0005; color: inherit; font: inherit; cursor: pointer; }
      .shop .tile:hover { border-color: var(--edge-strong); background: #2a3d50; }
      .shop .tile b { font-size: 11px; color: var(--gold); }
      .shop .tile.poor b { color: var(--down); }
      .shop .tile.poor .icon { filter: saturate(0.3) brightness(0.7); }
      .shop .tile.current { border-color: #7dff8a88; }
      .shop .shop-hint { margin: 8px 0 0; color: var(--dim); font-size: 11px; }

      /* Tooltip. */
      .tooltip {
        position: fixed; left: 0; top: 0; z-index: 40; display: none; width: max-content; max-width: 360px; padding: 9px 12px; pointer-events: none;
        background: linear-gradient(180deg, #141f29f7, #0b131af7); border: 1px solid var(--edge-strong); border-radius: 7px; box-shadow: 0 6px 20px #000c;
        color: var(--text); font: 13px/1.5 system-ui, sans-serif;
      }
      .tooltip.show { display: block; }
      .tip-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
      .tip-head strong { font-size: 15px; color: #fff; }
      .tip-head .gold { color: var(--gold); font-weight: 700; }
      .tip-sub { color: var(--dim); font-size: 12px; margin-bottom: 4px; }
      .tip-row { display: flex; justify-content: space-between; gap: 16px; }
      .tip-row span { color: var(--dim); }
      .tip-row b { font-weight: 600; }
      .tip-row b.up::after { content: ' ▲'; font-size: 9px; color: var(--up); }
      .tip-row b.down::after { content: ' ▼'; font-size: 9px; color: var(--down); }
      .tip-note b.up { color: var(--up); } .tip-note b.down { color: var(--down); }
      .tip-text { margin: 5px 0 0; white-space: pre-line; color: #d6e2ea; }
      .tip-next { margin-top: 6px; padding-top: 5px; border-top: 1px solid #ffffff1a; color: var(--gold); font-weight: 600; font-size: 11px; }
      .tip-levels { margin-top: 6px; border-collapse: collapse; font-size: 11px; width: 100%; }
      .tip-levels th, .tip-levels td { padding: 2px 4px; text-align: center; border-bottom: 1px solid #ffffff10; white-space: nowrap; }
      .tip-levels th:first-child { text-align: left; color: var(--dim); font-weight: 400; }
      .tip-levels tr:first-child th { color: var(--dim); font-weight: 600; }
      .tip-levels .on { color: #6ff0de; font-weight: 700; background: #6ff0de14; }
      .tip-lv { margin-top: 3px; } .tip-lv b { color: var(--dim); margin-right: 4px; } .tip-lv.on, .tip-lv.on b { color: #6ff0de; }
      .tip-list, .tip-note { margin-top: 5px; color: var(--dim); font-size: 11px; }

      /* Main menu and loading. */
      .menu {
        position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; overflow: hidden;
        background: radial-gradient(ellipse at 50% 30%, #1d5a7a 0%, #0c2a3e 55%, #06131d 100%); color: var(--text);
        font: 14px system-ui, sans-serif; transition: opacity 0.4s;
      }
      .menu.leaving { opacity: 0; pointer-events: none; }
      .menu-ships { position: absolute; inset: auto 0 0 0; height: 30vh; display: flex; justify-content: center; gap: 2vw; opacity: 0.35; filter: saturate(0.8); mask-image: linear-gradient(transparent, #000 40%); }
      .menu-ships i { width: 12vw; max-width: 160px; aspect-ratio: 1; background: center / cover; border-radius: 16px; transform: translateY(30%); }
      .menu-card {
        position: relative; width: min(520px, calc(100vw - 32px)); padding: 26px 28px 20px; border-radius: 14px;
        background: var(--panel); border: 1px solid var(--edge); box-shadow: 0 20px 60px #000c;
      }
      .menu h1 { margin: 0 0 18px; text-align: center; font-size: 44px; font-weight: 900; letter-spacing: 6px; color: #ffe08a;
        text-shadow: 0 0 22px #ff9a2a88, 0 4px 0 #6b2a00; }
      .menu h1 small { display: block; margin-top: 4px; font-size: 13px; letter-spacing: 2px; color: var(--dim); text-shadow: none; font-weight: 500; }
      .menu-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 10px 0; }
      .menu-row > span { color: var(--dim); min-width: 64px; }
      .seg { display: flex; flex-wrap: wrap; gap: 4px; }
      .seg button { min-width: 44px; padding: 6px 12px; border: 1px solid #ffffff1f; border-radius: 6px; background: #0006; color: var(--text); font: inherit; cursor: pointer; }
      .seg button:hover { border-color: var(--edge-strong); }
      .seg button.on { background: #2b1c08; border-color: var(--edge-strong); color: var(--gold); font-weight: 700; }
      .menu-note { margin: 12px 0 0; color: var(--dim); font-size: 12px; line-height: 1.5; }
      .menu-actions, .settings-actions, .results-actions { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }
      .menu-actions button, .settings-actions button, .results-actions button {
        padding: 9px 20px; border: 1px solid #ffffff2a; border-radius: 8px; background: #0006; color: var(--text); font: 600 14px system-ui, sans-serif; cursor: pointer;
      }
      .menu-actions button.primary, .settings-actions button.primary, .results-actions button.primary {
        background: linear-gradient(180deg, #e6b65a, #b07a1f); border-color: #ffe08a; color: #2b1600; padding: 9px 30px;
      }
      .menu-help { display: none; margin: 14px 0 0; color: var(--dim); font-size: 12px; line-height: 1.7; }
      .menu.show-help .menu-help { display: block; }
      .menu-loading { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); width: min(420px, calc(100vw - 48px)); text-align: center; color: var(--dim); font-size: 12px; }
      .menu-bar { height: 6px; margin-bottom: 6px; border-radius: 3px; background: #0008; overflow: hidden; }
      .menu-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #b07a1f, #ffe08a); transition: width 0.2s; }
      .menu.loading .menu-card { display: none; }
      .menu.loading .menu-loading { bottom: 50%; font-size: 15px; color: var(--text); }
      .menu.loading .menu-loading::before { content: '正在驶入海域…'; display: block; margin-bottom: 14px; font-size: 26px; font-weight: 800; color: #ffe08a; }

      /* Settings. */
      .gear { position: fixed; left: 48px; top: 34px; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--edge); background: var(--panel); color: var(--text); cursor: pointer; font-size: 15px; }
      .settings { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; background: #0008; font: 13px system-ui, sans-serif; color: var(--text); }
      .settings.show { display: grid; }
      .settings-card { width: min(420px, calc(100vw - 32px)); padding: 20px 24px; border-radius: 12px; background: var(--panel); border: 1px solid var(--edge); box-shadow: 0 16px 50px #000c; }
      .settings h2 { margin: 0 0 12px; font-size: 20px; color: var(--gold); text-align: center; }
      .settings section { margin: 12px 0; }
      .settings h3 { margin: 0 0 8px; font-size: 12px; color: var(--dim); font-weight: 600; letter-spacing: 1px; }
      .settings label { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
      .settings input[type=range] { flex: 1; accent-color: #e2bd70; }
      .settings .hint { margin: 6px 0 0; color: var(--dim); font-size: 11px; }

      /* Results. */
      .results { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; background: #000a; font: 13px system-ui, sans-serif; color: var(--text); animation: fadein 0.6s; }
      @keyframes fadein { from { opacity: 0; } }
      .results-card { width: min(860px, calc(100vw - 24px)); max-height: calc(100vh - 32px); overflow: auto; padding: 22px 26px; border-radius: 14px; background: var(--panel); border: 1px solid var(--edge); box-shadow: 0 20px 60px #000d; }
      .results h1 { margin: 0; text-align: center; font-size: 52px; font-weight: 900; letter-spacing: 8px; }
      .results.won h1 { color: #ffe08a; text-shadow: 0 0 24px #ff9a2a, 0 4px 0 #6b2a00; }
      .results.lost h1 { color: #ff8a7a; text-shadow: 0 0 24px #a02a1a, 0 4px 0 #3a0b0b; }
      .results-sub { margin: 4px 0 12px; text-align: center; color: var(--dim); }
      .results h3 { margin: 12px 0 4px; font-size: 14px; }
      .results .south { color: var(--south); } .results .north { color: var(--north); }
      .results table { width: 100%; border-collapse: collapse; }
      .results th { text-align: left; color: var(--dim); font-weight: 500; font-size: 11px; padding: 3px 6px; }
      .results td { padding: 4px 6px; border-top: 1px solid #ffffff0f; white-space: nowrap; }
      .results tr.me td { background: #e2bd7018; }
      .results td.ship .icon { margin-right: 6px; }
      .results .mvp { padding: 1px 5px; border-radius: 4px; background: #b07a1f; color: #2b1600; font-size: 10px; }

      /* Volume control. */
      .volume { position: fixed; left: 12px; top: 34px; font: 12px system-ui, sans-serif; color: var(--text); }
      .volume .speaker { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--edge); background: var(--panel); cursor: pointer; font-size: 14px; }
      .volume-panel { display: none; margin-top: 6px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; }
      .volume.open .volume-panel { display: grid; gap: 6px; }
      .volume-panel label { display: flex; align-items: center; gap: 8px; }
      .volume-panel input[type=range] { width: 120px; accent-color: #e2bd70; }

      /* Kill feed and announcements. */
      .killfeed { position: fixed; left: 12px; top: 84px; display: flex; flex-direction: column; gap: 3px; align-items: flex-start; pointer-events: none; font: 12px system-ui, sans-serif; }
      .sidebar { position: fixed; right: 12px; top: 56px; width: 236px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
      .miniboard { pointer-events: auto; padding: 6px 8px; border-radius: 8px; background: #0b131ad8; border: 1px solid #ffffff1a; color: var(--text); font: 12px 'Noto Sans SC', system-ui, sans-serif; }
      .miniboard .mb-head { display: flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; font-weight: 600; }
      .miniboard .mb-head span:first-child { flex: 1; color: var(--dim); font-weight: 500; }
      .miniboard .mb-head .arrow { color: var(--dim); }
      .miniboard .south { color: var(--south); } .miniboard .north { color: var(--north); }
      .miniboard table { width: 100%; margin-top: 4px; border-collapse: collapse; }
      .miniboard td { padding: 1px 3px; white-space: nowrap; }
      .miniboard td.ship { max-width: 92px; overflow: hidden; text-overflow: ellipsis; }
      .miniboard td.ship img, .miniboard td.ship .icon { vertical-align: middle; margin-right: 3px; }
      .miniboard tr.me td { background: #ffffff10; }
      .miniboard tr.sunk td { opacity: 0.55; } .miniboard tr.sunk td.st { opacity: 1; }
      .miniboard tr.gap td { height: 4px; }
      .miniboard td.st { width: 44px; text-align: right; }
      .miniboard .dead { color: #ff9b7a; font-style: normal; font-weight: 600; }
      .miniboard .hpbar { display: inline-block; width: 40px; height: 5px; border-radius: 3px; background: #ffffff1c; overflow: hidden; vertical-align: middle; }
      .miniboard .hpbar i { display: block; height: 100%; background: #5cff7a; }
      .timers { position: fixed; left: 50%; top: 46px; transform: translateX(-50%); display: none; gap: 6px; pointer-events: none; font: 12px 'Noto Sans SC', system-ui, sans-serif; }
      .timers.show { display: flex; }
      .timers span { padding: 2px 8px; border-radius: 5px; background: #0b131ad8; border: 1px solid #ffffff1a; color: var(--text); }
      .timers span.south { border-color: #5aa0ff66; } .timers span.north { border-color: #ff6a5a66; }
      .timers b { font-weight: 600; }
      .killfeed div { padding: 3px 9px; border-radius: 5px; background: #0b131ad0; border: 1px solid #ffffff14; color: var(--text); transition: opacity 1s; }
      .killfeed div.old { opacity: 0; }
      .killfeed .south { color: var(--south); } .killfeed .north { color: var(--north); }
      .killfeed .quest { border-color: #ffd34d55; } .killfeed .quest .gold { color: var(--gold); }
      .quests { display: none; padding: 8px 10px; border-radius: 8px; background: #0b131ad8;
        border: 1px solid #ffffff1a; color: var(--text); font: 12px 'Noto Sans SC', system-ui, sans-serif; pointer-events: none; }
      .quests.show { display: block; }
      .quests h4 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--gold); }
      .quests ul { margin: 0; padding-left: 16px; } .quests li { margin: 3px 0; } .quests li b { color: #ffd34d; font-weight: 600; }
      .quests small { display: block; color: #ff9b7a; } .quests p { margin: 0; color: var(--dim); }
      .tips { pointer-events: auto; }
      .tips h4 button { margin-left: auto; padding: 0 4px; border: 0; background: none; color: var(--dim); font: inherit; font-size: 14px; cursor: pointer; }
      .tips h4 button:hover { color: #fff; }
      .tips ol { margin: 0; padding-left: 18px; } .tips li { margin: 4px 0; color: var(--dim); }
      .tips li.now { color: #fff3d6; font-weight: 600; } .tips li.done { text-decoration: line-through; opacity: 0.6; }
      .tips li.done::marker { content: '✓ '; color: #8fe89a; }
      .tips li small { display: block; margin-top: 2px; color: #6ff0de; font-weight: 400; line-height: 1.4; }
      .gift { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; font-size: 12px; color: var(--dim); }
      .gift button { padding: 2px 10px; }
      .tile.contract b { color: #ffd34d; }
      .announce {
        position: fixed; left: 50%; top: 22%; transform: translate(-50%, -50%) scale(0.8); opacity: 0; pointer-events: none; text-align: center;
        transition: opacity 0.25s, transform 0.25s cubic-bezier(.2,1.6,.4,1); font-family: system-ui, sans-serif;
      }
      .announce.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      .announce strong { display: block; font-size: 38px; font-weight: 900; letter-spacing: 2px; color: #ffe08a; text-shadow: 0 0 18px #ff9a2a, 0 3px 0 #6b2a00, 0 0 4px #000; }
      .announce.south strong { color: #bfe0ff; text-shadow: 0 0 18px #3f7fe0, 0 3px 0 #0b2a5a, 0 0 4px #000; }
      .announce.north strong { color: #ffd0c8; text-shadow: 0 0 18px #e0483c, 0 3px 0 #5a0b0b, 0 0 4px #000; }
      .announce small { display: block; margin-top: 4px; font-size: 14px; color: #fff; text-shadow: 0 1px 3px #000; }

      /* Scoreboard (hold Tab). */
      .scoreboard {
        position: fixed; left: 50%; top: 60px; transform: translateX(-50%); display: none; padding: 10px 16px 14px; min-width: 640px;
        background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; box-shadow: 0 8px 30px #000c; color: var(--text);
        font: 13px system-ui, sans-serif; pointer-events: none;
      }
      .scoreboard.show { display: block; }
      .scoreboard h3 { margin: 6px 0 4px; font-size: 14px; }
      .scoreboard table { width: 100%; border-collapse: collapse; }
      .scoreboard th { text-align: left; color: var(--dim); font-weight: 500; font-size: 11px; padding: 2px 6px; }
      .scoreboard td { padding: 3px 6px; border-top: 1px solid #ffffff0f; }
      .scoreboard tr.me td { background: #e2bd7018; }
      .scoreboard td.ship .icon { margin-right: 6px; }
      .scoreboard td.items .icon { margin-right: 2px; }
      /* Narrow windows: smaller minimap, the command panel beside it, the shop above. */
      @media (max-width: 1100px) {
        .minimap { width: 150px; height: 150px; }
        .command, .command.info.show { left: 170px; right: 8px; transform: none; width: auto; min-width: 0; max-width: none; flex-wrap: wrap; gap: 6px; }
        .command .skills, .command .items { padding-left: 0; border-left: 0; }
        .shop { bottom: 230px; width: min(312px, calc(100vw - 20px)); max-height: calc(100vh - 300px); }
        .scoreboard { min-width: 0; width: calc(100vw - 40px); font-size: 11px; }
        #help { display: none; }
      }
      .repair {
        position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); display: none; padding: 8px 16px;
        border: 1px solid #5cff7a88; border-radius: 6px; background: #12301ce6; color: #c8ffd2; font: 14px system-ui, sans-serif; cursor: pointer;
      }
      .repair.show { display: block; }
      .target-hint {
        position: fixed; left: 50%; top: 52px; transform: translateX(-50%); display: none; padding: 6px 14px; border-radius: 6px;
        background: #1d3b5ccc; color: #fff; font: 14px system-ui, sans-serif; pointer-events: none;
      }
      .target-hint.show { display: block; }
      body.targeting canvas { cursor: crosshair; }
      .selection-box {
        position: fixed; display: none; pointer-events: none;
        border: 1px solid #7dff8a; background: #7dff8a22;
      }

      /* ===== Theme: hand-painted fantasy — dark ship timber, blackened iron, teal gems (art from tools/art/src/ui.ts) ===== */
      :root {
        --font-ui: 'Noto Sans SC', system-ui, sans-serif; --font-title: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
        --text: #efe5cf; --dim: #b8a98a; --gold: #f5cd58; --teal: #3fd6c4; --teal-strong: #79f2e2; --teal-dim: rgba(63, 214, 196, 0.16);
        --wood: linear-gradient(180deg, #2c1f15f2, #1b130df2); --iron: #4a4038;
        --edge: #6b5640; --edge-strong: var(--teal); --panel: var(--wood); --line: rgba(239, 229, 207, 0.12); --line-strong: rgba(239, 229, 207, 0.25);
        --accent: var(--teal); --accent-strong: var(--teal-strong); --accent-dim: var(--teal-dim);
      }
      body, button, input { font-family: var(--font-ui); }
      .icon { background: #1d1813; }

      /* Big panels: the timber-and-iron frame as a border image. */
      .menu-card, .settings-card, .results-card, .scoreboard, .command, .command.info.show {
        background: none !important; border-style: solid !important; border-color: transparent !important; border-width: 22px !important; border-radius: 0 !important;
        border-image: url(/ui/woodFrame.webp) 14% fill / 22px stretch !important; box-shadow: none !important; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.55));
        backdrop-filter: none; color: var(--text);
      }
      .command, .command.info.show { border-width: 16px !important; border-image-width: 16px !important; padding: 2px 4px !important; }
      .miniboard, .quests, .tooltip {
        background: none !important; border: 13px solid transparent !important; border-radius: 0 !important;
        border-image: url(/ui/woodFrame.webp) 14% fill / 13px stretch !important; box-shadow: none; filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.5));
        padding: 2px 4px !important; color: var(--text);
      }
      /* Small notes: a dark plank with an iron edge. */
      .toast, .shop-hint, .killfeed div, .respawn, .banner, .volume-panel, .timers span {
        background: var(--wood) !important; border: 1px solid var(--edge) !important; border-radius: 5px; box-shadow: inset 0 1px 0 rgba(255, 220, 160, 0.08), 0 4px 12px rgba(0, 0, 0, 0.5) !important;
        backdrop-filter: none; color: var(--text);
      }
      .timers span.south { border-color: #5aa0ff99 !important; } .timers span.north { border-color: #ff6a5a99 !important; }
      .killfeed .quest { border-color: rgba(63, 214, 196, 0.5) !important; }

      /* Top bar: the long iron-capped plaque. */
      .topbar {
        top: 4px; background: none !important; border-style: solid !important; border-color: transparent !important; border-width: 0 30px !important; border-radius: 0 !important;
        border-image: url(/ui/woodPlaque.webp) 0 14% fill / 0 30px stretch !important; padding: 11px 14px 13px; box-shadow: none !important;
        filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.55)); font: 600 15px var(--font-ui); color: var(--text);
      }
      .topbar .clock, .topbar .kd, .topbar .tod { color: var(--dim); font-weight: 500; }
      .timers { top: 58px; }
      .sidebar { top: 64px; }

      /* Buttons: a wooden plank in an iron rim; the main action and chosen options glow teal. */
      .menu-actions button, .settings-actions button, .results-actions button, .seg button, .command.info .status button, .gift button {
        background: none !important; border-style: solid; border-color: transparent; border-width: 0 15px; border-radius: 0; clip-path: none;
        border-image: url(/ui/woodButton.webp) 0 12% fill / 0 15px stretch; color: var(--text); font-weight: 600; letter-spacing: 1px;
        text-shadow: 0 1px 2px #000; transition: filter 0.15s; box-shadow: none !important;
      }
      .menu-actions button:hover, .settings-actions button:hover, .results-actions button:hover, .seg button:hover, .command.info .status button:hover, .gift button:hover {
        filter: brightness(1.25);
      }
      .menu-actions button.primary, .settings-actions button.primary, .results-actions button.primary, .seg button.on {
        border-image: url(/ui/woodButtonOn.webp) 0 13% fill / 0 18px stretch; border-width: 0 18px; color: #f2fffd; font-weight: 800;
        text-shadow: 0 0 8px rgba(0, 60, 55, 0.9), 0 1px 2px #000;
      }
      .menu-actions button, .settings-actions button, .results-actions button { min-height: 46px; padding: 0 16px; font-size: 16px; }
      .menu-actions button, .settings-actions button, .results-actions button { white-space: nowrap; }
      .menu-actions { gap: 6px; }
      .menu-actions button { flex: 1 1 auto; padding: 0 6px; font-size: 15px; }
      .seg button { min-height: 36px; min-width: 50px; padding: 0 6px; font-size: 14px; }
      .command.info .status button, .gift button { min-height: 28px; padding: 0 6px; }
      .gear, .volume .speaker {
        width: 38px; height: 38px; padding: 0; border: 0; border-radius: 0; font-size: 15px; color: var(--text);
        background: url(/ui/woodSlot.webp) center / 100% 100% no-repeat; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.6));
      }
      .gear { left: 54px; }
      /* Fullscreen: top right over the menu, then beside the gear in a match. */
      .fullscreen {
        position: fixed; right: 16px; top: 16px; z-index: 21; display: grid; place-items: center; width: 38px; height: 38px; padding: 0; border: 0; cursor: pointer;
        color: var(--text); background: url(/ui/woodSlot.webp) center / 100% 100% no-repeat; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.6));
      }
      .fullscreen:hover, .gear:hover, .volume .speaker:hover { filter: brightness(1.25) drop-shadow(0 3px 6px rgba(0, 0, 0, 0.6)); }
      .fullscreen svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .fullscreen.in-match { right: auto; left: 96px; top: 34px; z-index: auto; }
      /* Game speed and the codex, after the fullscreen button in the top-left row. */
      .speed, .codex-button {
        position: fixed; top: 34px; height: 38px; padding: 0; border: 0; cursor: pointer; color: var(--text); font: 700 13px var(--font-ui);
        background: url(/ui/woodSlot.webp) center / 100% 100% no-repeat; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.6));
      }
      .speed { left: 138px; width: 46px; }
      .speed.fast { color: var(--gold); }
      .codex-button { left: 188px; width: 38px; font-size: 16px; }
      .speed:hover, .codex-button:hover { filter: brightness(1.25) drop-shadow(0 3px 6px rgba(0, 0, 0, 0.6)); }
      .settings-card { max-height: calc(100vh - 32px); overflow-y: auto; }
      .settings .seg.speeds { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
      .settings .seg.speeds span { color: var(--dim); margin-right: 4px; }
      .settings .seg.speeds button { min-width: 0; padding: 0 4px; font-size: 13px; }
      .settings .links { display: flex; gap: 18px; }
      .settings-card.keys { width: min(560px, calc(100vw - 32px)); }
      .key-groups { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; }
      .key-groups section { margin: 6px 0; }
      .key-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 0; }
      .key-row button {
        min-width: 74px; padding: 3px 8px; border: 1px solid var(--edge); border-radius: 4px; background: rgba(0, 0, 0, 0.45);
        color: #fff3d6; font: 600 12px var(--font-ui); cursor: pointer;
      }
      .key-row button:hover { border-color: var(--teal); }
      .key-row button.unset { color: var(--dim); font-weight: 400; }
      .key-row button.waiting { border-color: var(--teal); color: var(--teal-strong); box-shadow: 0 0 8px rgba(63, 214, 196, 0.5); }
      @media (max-width: 600px) { .key-groups { grid-template-columns: 1fr; } }
      /* Tutorial: the lesson card under the top bar. */
      .tutorial {
        position: fixed; left: 50%; top: 66px; z-index: 6; display: none; width: min(460px, calc(100vw - 520px)); min-width: 300px; translate: -50% 0; padding: 4px 8px 6px;
        border: 14px solid transparent; border-image: url(/ui/woodFrame.webp) 14% fill / 14px stretch; filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.55));
        color: var(--text); font: 13px/1.55 var(--font-ui); animation: fadein 0.3s;
      }
      .tutorial.show { display: block; }
      .tutorial-head { display: flex; justify-content: space-between; align-items: center; color: var(--dim); font-size: 11px; letter-spacing: 1px; }
      .tutorial h3 { margin: 4px 0 2px; font: 400 21px var(--font-title); color: #fff3d6; }
      .tutorial p { margin: 0 0 6px; color: #efe5cf; }
      .tutorial p b { color: var(--teal-strong); }
      .tutorial kbd { padding: 0 6px; border: 1px solid var(--edge); border-radius: 3px; background: rgba(0, 0, 0, 0.5); color: var(--gold); font: 600 12px var(--font-ui); }
      .tutorial-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
      .tutorial-foot b { color: #8fe89a; }
      .tutorial .dots { display: flex; gap: 4px; }
      .tutorial .dots i { width: 8px; height: 8px; rotate: 45deg; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--edge); }
      .tutorial .dots i.on { background: var(--teal); border-color: var(--teal); }
      .tutorial .dots i.now { border-color: var(--teal-strong); box-shadow: 0 0 6px var(--teal); }
      .tutorial button { padding: 2px 10px; border: 1px solid var(--edge); border-radius: 4px; background: rgba(0, 0, 0, 0.4); color: var(--dim); font: 12px var(--font-ui); cursor: pointer; }
      .tutorial button:hover { color: #fff; border-color: var(--teal); }
      .tutorial button.primary { color: #f2fffd; border-color: var(--teal); background: var(--teal-dim); font-weight: 700; }
      /* Details everywhere: one color per kind of stat, lit numbers and effect words, kind badges. */
      .s-hp { color: #86e08f; } .s-armor { color: #a9c8ea; } .s-speed { color: #72e2ee; } .s-heal { color: #b2f08f; }
      .s-dmg { color: #ff9f72; } .s-range { color: #93b9ff; } .s-time { color: #cdb7ff; } .s-gold { color: var(--gold); }
      .tip-text .n, .codex-note .n { color: #ffe3a3; font-weight: 600; }
      .tip-text .lbl { color: var(--dim); }
      .tip-text .bul { display: inline-block; width: 5px; height: 5px; margin: 0 7px 2px 2px; rotate: 45deg; background: var(--teal); vertical-align: middle; }
      .tip-text em, .codex-note em { font-style: normal; font-weight: 600; }
      .fx-ice { color: #8fdcff; } .fx-fire { color: #ff8a4c; } .fx-shock { color: #c99dff; } .fx-heal { color: #8fe89a; }
      .fx-poison { color: #b9e05a; } .fx-shield { color: #ffd25a; } .fx-sight { color: #9fe0d2; } .fx-warn { color: #ff9b7a; }
      .tip-kind {
        display: inline-block; margin-right: 6px; padding: 0 6px; border: 1px solid currentColor; border-radius: 3px; font-size: 10px; font-weight: 700;
        line-height: 16px; letter-spacing: 1px; vertical-align: 1px; background: rgba(0, 0, 0, 0.35);
      }
      .k-ship { color: #f5cd58; } .k-weapon { color: #ff9f72; } .k-item { color: #6ff0de; } .k-skill { color: #c99dff; }
      .k-hire { color: #a9c8ea; } .k-friend { color: #8fe89a; } .k-enemy { color: #ff7a6a; } .k-neutral { color: #e0cf9a; }
      em.k-skill, em.k-weapon { font-style: normal; }
      .tip-list .chip { display: inline-block; margin: 0 4px 2px 0; padding: 0 6px; border-radius: 3px; background: rgba(255, 155, 122, 0.15); color: #ffb39a; font-style: normal; }
      .tip-levels td.on { color: #6ff0de; }
      .command.info .statgrid b[class^="s-"] { font-weight: 700; }

      /* In-game confirmation box (over the settings panel). */
      .dialog { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; background: #0009; font: 14px var(--font-ui); color: var(--text); animation: fadein 0.15s; }
      .dialog-card { width: min(400px, calc(100vw - 32px)); }
      .dialog-card p { margin: 4px 0 6px; line-height: 1.7; white-space: pre-line; }

      /* Codex. */
      .codex { position: fixed; inset: 0; z-index: 28; display: none; place-items: center; background: #0008; font: 13px var(--font-ui); color: var(--text); }
      .codex.show { display: grid; }
      .codex-card {
        box-sizing: border-box; display: flex; flex-direction: column; width: min(1040px, calc(100vw - 24px)); height: min(680px, calc(100vh - 24px)); padding: 6px 10px;
        border: 22px solid transparent; border-image: url(/ui/woodFrame.webp) 14% fill / 22px stretch; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.55));
      }
      .codex-head { display: flex; align-items: center; gap: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
      .codex-head h2 { margin: 0; font: 400 26px var(--font-title); color: #fff3d6; }
      .codex-head nav { display: flex; gap: 6px; }
      .codex-head nav button { padding: 4px 14px; border: 1px solid var(--edge); border-radius: 4px; background: rgba(0, 0, 0, 0.4); color: var(--dim); font: 600 14px var(--font-ui); cursor: pointer; }
      .codex-head nav button.on { border-color: var(--teal); color: #f2fffd; background: var(--teal-dim); }
      .codex-head input { margin-left: auto; width: 180px; padding: 5px 9px; border: 1px solid var(--edge); border-radius: 4px; background: rgba(0, 0, 0, 0.5); color: var(--text); font: inherit; }
      .codex-close { padding: 0 4px; border: 0; background: none; color: var(--dim); font-size: 22px; cursor: pointer; }
      .codex-close:hover { color: #fff; }
      .codex-body { flex: 1; display: grid; grid-template-columns: 1fr 320px; gap: 14px; min-height: 0; padding-top: 8px; }
      .codex-list { overflow-y: auto; padding-right: 6px; }
      .codex-list h4 { margin: 8px 0 5px; color: var(--dim); font-size: 12px; font-weight: 600; letter-spacing: 2px; }
      .codex-list .grid { display: flex; flex-wrap: wrap; gap: 6px; }
      .codex-list .tile {
        display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 2px 2px 1px; border: 1px solid #120d09; border-radius: 5px; background: #0e0b08; cursor: pointer;
        box-shadow: 0 0 0 1px rgba(150, 120, 85, 0.45);
      }
      .codex-list .tile .icon { width: 50px; height: 50px; border-radius: 4px; }
      .codex-list .tile b { font-size: 11px; color: var(--gold); }
      .codex-list .tile:hover, .codex-list .tile.on { box-shadow: 0 0 0 1px var(--teal), inset 0 0 0 1px var(--teal), inset 0 0 10px rgba(63, 214, 196, 0.55); }
      .codex-empty { color: var(--dim); }
      .codex-detail { overflow-y: auto; padding: 4px 12px; border-left: 1px solid var(--line); line-height: 1.5; }
      .codex-detail h4 { margin: 12px 0 6px; color: var(--dim); font-size: 12px; letter-spacing: 1px; }
      .codex-skills { display: flex; flex-wrap: wrap; gap: 8px; }
      .codex-skills span { display: flex; align-items: center; gap: 6px; padding: 2px 8px 2px 2px; border-radius: 5px; background: rgba(0, 0, 0, 0.35); cursor: help; }
      .codex-skills .icon { width: 34px; height: 34px; border-radius: 4px; }
      .codex-skills em { font-style: normal; font-size: 12px; }
      .codex-body { grid-template-columns: 1fr 360px; }
      .codex-sec { margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--line); }
      .codex-sec h4 { margin: 0 0 6px !important; color: var(--teal-strong) !important; }
      .codex-sources { margin: 0; padding: 0; list-style: none; }
      .codex-sources li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 4px 0; }
      .codex-sources li b { color: #fff3d6; }
      .codex-sources li span { color: var(--dim); font-size: 12px; }
      .codex-sources li.off, .codex-sources li.off b { color: #8d806a; }
      .codex-sources li small { flex-basis: 100%; color: var(--dim); font-size: 11px; }
      .codex-chip {
        display: inline-flex; align-items: center; gap: 5px; margin: 2px 0; padding: 1px 8px 1px 1px; border: 1px solid rgba(150, 120, 85, 0.45); border-radius: 4px;
        background: rgba(0, 0, 0, 0.4); font: 600 12px var(--font-ui); cursor: pointer; vertical-align: middle;
      }
      .codex-chip .icon { width: 24px; height: 24px; border-radius: 3px; }
      .codex-chip:hover { border-color: var(--teal); }
      .codex-chip.on { border-color: var(--teal); box-shadow: 0 0 8px rgba(63, 214, 196, 0.5); }
      .codex-chain { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 4px 0; }
      .codex-chain .arrow { display: inline-flex; flex-direction: column; align-items: center; color: var(--teal); font-weight: 700; line-height: 1; }
      .codex-chain .arrow small { color: var(--dim); font-size: 10px; font-weight: 400; max-width: 90px; text-align: center; }
      .codex-chain.v { flex-direction: column; align-items: flex-start; gap: 0; }
      .codex-chain.v + .codex-chain.v { margin-top: 10px; }
      .codex-chain .via { display: flex; align-items: center; gap: 6px; margin: 1px 0 1px 10px; font-size: 12px; }
      .codex-chain .via > span { color: var(--teal); font-weight: 700; font-size: 15px; }
      .codex-chain .via .codex-chip { opacity: 0.85; font-weight: 400; }
      .codex .plus { margin: 0 3px; color: var(--teal); font-style: normal; font-weight: 700; }
      .codex-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 3px 0; }
      .codex-row small { color: var(--dim); }
      .codex-ships { display: flex; flex-wrap: wrap; gap: 4px 8px; }
      .codex-ships span { display: inline-flex; align-items: center; gap: 4px; }
      .codex-note { margin: 4px 0; color: #d6e2ea; font-size: 12px; line-height: 1.6; }
      @media (max-width: 760px) { .codex-body { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } .codex-detail { border-left: 0; border-top: 1px solid var(--line); max-height: 40vh; } }
      .settings button.link { margin-top: 4px; padding: 0; border: 0; background: none; color: var(--teal); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
      .settings button.link:disabled { color: var(--dim); cursor: default; text-decoration: none; }

      /* Beginner's guide: situation hints, the pointer over the shop, the + on skills glowing. */
      .tips.hint { animation: fadein 0.4s; }
      .tips.hint h4 { color: #ffb36b; }
      .tips.hint p { color: #fff3d6; line-height: 1.5; }
      .tip-pointer {
        position: fixed; left: 0; top: 0; z-index: 5; display: none; padding: 4px 10px; pointer-events: none; white-space: nowrap;
        background: var(--wood); border: 1px solid var(--teal); border-radius: 5px; color: #f2fffd; font: 600 13px var(--font-ui); text-shadow: 0 1px 2px #000;
        box-shadow: 0 0 12px rgba(63, 214, 196, 0.55), 0 4px 10px rgba(0, 0, 0, 0.6);
      }
      .tip-pointer.show { display: block; }
      .tip-pointer.edge::after { display: none; }
      .tip-pointer::after {
        content: ''; position: absolute; left: 50%; top: calc(100% + 4px); translate: -50% 0; border: 9px solid transparent; border-top-color: var(--teal);
        animation: bob 0.9s ease-in-out infinite alternate;
      }
      @keyframes bob { to { transform: translateY(8px); } }
      body.tip-learn .command .learn { scale: 1.25; box-shadow: 0 0 0 3px rgba(63, 214, 196, 0.6), 0 0 16px var(--teal); }

      /* Headings: a carved-title serif, parchment on dark. */
      .menu h1, .settings h2, .results h1, .announce strong { font-family: var(--font-title); }
      .menu-row > span, .settings h3, .command.info .goods h4, .results h3, .scoreboard h3, .quests h4 { display: flex; align-items: center; gap: 8px; }
      .menu-row > span::before, .settings h3::before, .command.info .goods h4::before, .quests h4::before {
        content: ''; width: 7px; height: 7px; rotate: 45deg; background: var(--teal); box-shadow: 0 0 6px var(--teal); flex: none;
      }
      .quests h4 { color: var(--gold); }

      /* Main menu: the key art behind a timber card with the crest. */
      .menu { background: #070b10 url(/ui/keyart.webp) center / cover no-repeat; place-items: center start; padding-left: max(32px, 7vw); }
      .menu::before { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8, 6, 4, 0.85) 0%, rgba(8, 6, 4, 0.45) 45%, rgba(8, 6, 4, 0.15) 100%); }
      .menu-ships { display: none; }
      .menu-card { position: relative; width: min(470px, calc(100vw - 32px)); padding: 10px 14px 6px; overflow: visible; }
      .menu h1 { display: flex; align-items: center; gap: 14px; margin: -54px 0 18px; text-align: left; font-size: 50px; font-weight: 400; letter-spacing: 3px; line-height: 1.05; }
      .menu h1 img { width: 112px; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.7)); }
      .menu h1 span { display: flex; flex-direction: column; background: linear-gradient(180deg, #fff6dc 10%, #d9b878 90%); -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 2px 0 #2a1a0c) drop-shadow(0 4px 8px rgba(0, 0, 0, 0.8)); }
      .menu h1 small { display: block; margin-top: 6px; font-family: var(--font-ui); font-size: 13px; font-weight: 500; letter-spacing: 3px; -webkit-text-fill-color: var(--teal); }
      .menu-row > span { color: var(--dim); font-size: 13px; }
      .menu-note { color: var(--dim); }
      .menu-actions { justify-content: flex-start; }
      .menu-bar { height: 6px; border-radius: 3px; background: rgba(0, 0, 0, 0.55); border: 1px solid var(--edge); box-shadow: none; }
      .menu-bar i { background: linear-gradient(90deg, #1f8f84, var(--teal)); box-shadow: 0 0 10px var(--teal); }
      .menu-loading { left: max(32px, 7vw); transform: none; text-align: left; color: var(--dim); }
      .menu.loading { background-image: url(/ui/loading.webp); place-items: center; padding-left: 0; }
      .menu.loading .menu-loading { left: 50%; transform: translateX(-50%); text-align: center; }
      .menu.loading.resuming .menu-loading::before { content: '正在恢复对局…'; }
      /* The replay keeps the page busy, so the bar jumps to each step instead of easing. */
      .menu.resuming .menu-bar i { transition: none; }
      .menu-resume button {
        display: flex; width: 100%; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; min-height: 46px; padding: 0 16px; cursor: pointer;
        border-style: solid; border-color: transparent; border-width: 0 18px; border-image: url(/ui/woodButtonOn.webp) 0 13% fill / 0 18px stretch; background: none;
        color: #f2fffd; font: 800 16px var(--font-ui); letter-spacing: 1px; text-shadow: 0 0 8px rgba(0, 60, 55, 0.9), 0 1px 2px #000; transition: filter 0.15s;
      }
      .menu-resume button:hover { filter: brightness(1.25); }
      .menu-resume small { font-weight: 500; font-size: 12px; color: #c9f5ee; letter-spacing: 0; }
      .menu.loading .menu-loading::before { font-family: var(--font-title); font-size: 34px; color: #fff3d6; text-shadow: 0 3px 10px #000; letter-spacing: 3px; }
      .menu.loading::after {
        content: ''; position: absolute; left: 50%; top: 32%; width: 180px; height: 180px; translate: -50% -50%;
        background: url(/ui/woodCrest.webp) center / contain no-repeat; filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.7));
      }
      .menu-compass {
        position: absolute; width: 520px; height: 520px; left: -160px; top: 50%; translate: 0 -50%; pointer-events: none; opacity: 0.08;
        background: url(/ui/compassLines.webp) center / contain no-repeat; animation: turn 240s linear infinite;
      }
      @keyframes turn { to { rotate: 360deg; } }
      .divider { display: block; height: 1px; margin: 16px 0; background: linear-gradient(90deg, transparent, var(--edge), transparent); }

      /* Settings and results. */
      .settings h2 { font-size: 26px; font-weight: 400; color: #fff3d6; text-align: left; margin: 0; }
      .settings h3 { font-size: 12px; color: var(--dim); letter-spacing: 2px; }
      .settings-actions { justify-content: flex-end; }
      .settings input[type=range], .volume-panel input[type=range] { accent-color: var(--teal); }
      .results h1 { font-size: 56px; font-weight: 400; letter-spacing: 8px; }
      .results.won h1 { color: #fff3d6; text-shadow: 0 0 30px rgba(63, 214, 196, 0.55), 0 3px 0 #2a1a0c; }
      .results.lost h1 { color: #ff9a86; text-shadow: 0 0 30px rgba(255, 90, 70, 0.45), 0 3px 0 #2a1a0c; }
      .results tr.me td, .scoreboard tr.me td, .miniboard tr.me td { background: var(--teal-dim); }
      .results .mvp { background: var(--gold); color: #1a1200; }

      /* Bottom panel and shop: the portrait sits in the ornate iron slot; skills, items and goods get a
         thin dark iron rim so the icons, not the frames, catch the eye. */
      .command .portrait .icon, .command.info .shop-head .portrait .icon {
        border: 0 !important; border-radius: 0 !important; background: url(/ui/woodSlot.webp) center / 100% 100% no-repeat !important; padding: 6px !important;
      }
      .command .portrait .icon { width: 64px; height: 64px; box-sizing: border-box; }
      .command .portrait .icon i { inset: 6px; }
      .command .skill > button[data-cast], .command .slot, .command.info .tile {
        border: 1px solid #120d09 !important; border-radius: 5px !important; background: #0e0b08 !important; padding: 0 !important;
        box-shadow: 0 0 0 1px rgba(150, 120, 85, 0.45), inset 0 1px 0 rgba(255, 230, 190, 0.06) !important;
      }
      .command.info .tile { padding: 2px 2px 1px !important; }
      .command .skill .icon { width: 50px; height: 50px; border-radius: 4px; }
      .command .item .icon { width: 38px; height: 38px; border-radius: 4px; }
      .command .items { grid-template-columns: repeat(3, 40px); grid-auto-rows: 40px; }
      .command.info .tile .icon { width: 40px; height: 40px; border-radius: 4px; }
      .command .item.empty { opacity: 1; background: rgba(0, 0, 0, 0.35) !important; box-shadow: 0 0 0 1px rgba(150, 120, 85, 0.25) !important; }
      /* Hover glows inward, so tiles at the edge of the scrolling goods list are never cut off. */
      .command .skill > button[data-cast]:hover:not([disabled]), .command button.item:hover, .command.info .tile:hover { filter: brightness(1.15); box-shadow: 0 0 0 1px var(--teal), inset 0 0 0 1px var(--teal), inset 0 0 10px rgba(63, 214, 196, 0.55) !important; }
      /* The info card and the shop, a size up from the command panel. */
      .command.info.show { width: fit-content; min-width: 460px; max-width: min(1000px, calc(100vw - 440px)); }
      .command.info .goods { max-height: 44vh; padding: 3px 4px 4px; gap: 6px 14px; }
      .command.info .goods .grid { gap: 6px; }
      .command.info .tile .icon { width: 54px; height: 54px; }
      .command.info .tile b { font-size: 12px; }
      .command.info .goods h4 { font-size: 12px; }
      .command.info .portrait .icon, .command.info .shop-head .portrait .icon { width: 84px; height: 84px; }
      .command.info .portrait .icon i { inset: 8px; }
      .command.info .vitals { width: 230px; }
      .command.info .name { font-size: 17px; }
      .command.info .name small { font-size: 12px; }
      .command.info .bar.hp { height: 18px; } .command.info .bar.hp span { line-height: 18px; font-size: 11px; }
      .command.info .statgrid { grid-template-columns: repeat(2, minmax(140px, auto)); gap: 4px 18px; }
      .command.info .statgrid div { font-size: 13px; }
      .command.info .status { font-size: 13px; }
      .command.info .icon.small { width: 38px; height: 38px; }
      .command.info .loadout { padding: 2px 4px 2px 10px; }
      .command .skills, .command .items, .command.info .statgrid, .command.info .loadout { border-left: 1px solid rgba(239, 229, 207, 0.12); }
      .command .portrait .lv { background: #1b130d; border: 1px solid var(--teal); color: var(--teal-strong); }
      .command .name { font-size: 15px; font-weight: 700; color: #fff3d6; }
      .command .bar { border: 1px solid #000; background: rgba(0, 0, 0, 0.6); }
      .command .bar.hp i { background: linear-gradient(180deg, #74e07e, #2c8d38); }
      .command .bar.xp i { background: linear-gradient(180deg, #6ff0de, #1f8f84); }
      .command .learn { background: radial-gradient(circle at 35% 35%, #79f2e2, #1f8f84); border-color: #b8fff5; animation: pulse 1.2s ease-in-out infinite; }
      @keyframes pulse { 50% { box-shadow: 0 0 10px var(--teal); } }
      .command .dots i.on { background: var(--teal); box-shadow: 0 0 3px var(--teal); }
      .command.info .goods h4 { color: var(--dim); font-size: 11px; letter-spacing: 2px; }
      .command.info .status .ok { color: #8fe89a; } .command.info .status .no { color: #ffb36b; }
      /* A hanging banner beside the command panel. */
      .command::after {
        content: ''; position: absolute; right: -58px; top: -26px; width: 52px; height: 86px; pointer-events: none;
        background: url(/ui/woodBanner.webp) top center / contain no-repeat; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.6));
      }
      .announce strong { font-weight: 400; letter-spacing: 4px; }
      .tip-head strong { color: #fff3d6; }
      .tip-head .gold, .command.info .tile b, .shop .tile b { color: var(--gold); }

      .minimap {
        border: 16px solid transparent !important; border-radius: 0; border-image: url(/ui/woodFrame.webp) 14% / 16px stretch !important;
        box-shadow: none; filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.6)); left: 6px; bottom: 6px;
      }
      .perf-graph { position: fixed; left: 10px; top: 76px; width: 300px; height: 80px; z-index: 6; pointer-events: none; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" class="panel"></div>
    <div id="help" class="panel">左键选择 · 右键航行 · 方向键 / 边缘 / 中键平移 · 滚轮缩放
技能快捷键见技能图标 · 1–6 物品 · 按住 Tab 查看战况 · 空格回到船只 · P 暂停 · F9 帧率图 · F10 设置 · Alt+Enter 全屏</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
