<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOOM 海战</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1d2a; overflow: hidden; user-select: none; }
      #app { position: fixed; inset: 0; }
      .panel {
        position: fixed; font: 13px/1.5 system-ui, sans-serif; color: #e6f1f7;
        text-shadow: 0 1px 2px #000a; pointer-events: none; white-space: pre;
      }
      #hud { left: 12px; top: 10px; }
      #help { right: 12px; top: 10px; text-align: right; opacity: 0.7; font-size: 12px; }
      .minimap {
        position: fixed; left: 12px; bottom: 12px; width: 220px; height: 220px;
        border: 2px solid #0008; border-radius: 4px; cursor: pointer;
      }
      .overlay { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      :root {
        --panel: linear-gradient(180deg, #1a2a38f2, #0d1720f2); --edge: #c9a25a66; --edge-strong: #e2bd70;
        --text: #e9f1f6; --dim: #93a9b8; --gold: #ffd25a; --up: #7dff8a; --down: #ff7a6a;
        --south: #5aa0ff; --north: #ff6a5a;
      }
      .hud-panel { background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; box-shadow: 0 4px 18px #0008, inset 0 1px 0 #ffffff14; color: var(--text); }
      .topbar {
        position: fixed; left: 50%; top: 8px; transform: translateX(-50%); display: flex; gap: 18px; align-items: center;
        padding: 5px 16px; background: var(--panel); border: 1px solid var(--edge); border-radius: 0 0 10px 10px;
        color: var(--text); font: 600 15px system-ui, sans-serif; box-shadow: 0 4px 14px #0007; pointer-events: none; white-space: nowrap;
      }
      .topbar .gold { color: var(--gold); }
      .topbar .gold::before { content: ''; display: inline-block; width: 12px; height: 12px; margin-right: 6px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3b0, #e0a320 60%, #8a5a08); vertical-align: -1px; }
      .topbar .score { font-size: 18px; }
      .topbar .south, .scoreboard .south { color: var(--south); }
      .topbar .north, .scoreboard .north { color: var(--north); }
      .topbar .clock, .topbar .kd { color: var(--dim); font-weight: 500; }
      .respawn {
        position: fixed; left: 50%; top: 30%; transform: translateX(-50%); display: none; padding: 10px 22px; border-radius: 8px;
        background: #000a; color: #ffb3a8; font: 600 20px system-ui, sans-serif; pointer-events: none;
      }
      .respawn.show { display: block; }
      .toast {
        position: fixed; left: 50%; top: 52px; transform: translateX(-50%); padding: 6px 14px; border-radius: 6px;
        background: #1d2a36ee; border: 1px solid var(--edge); color: #fff; font: 14px system-ui, sans-serif; opacity: 0; transition: opacity 0.2s; pointer-events: none;
      }
      .toast.show { opacity: 1; }
      .banner {
        position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); display: none; padding: 18px 36px;
        border-radius: 10px; font: bold 30px system-ui, sans-serif; color: #fff; background: #000b; border: 1px solid var(--edge-strong);
      }
      .banner.show { display: block; }
      .banner.win { color: var(--gold); }
      .banner.lose { color: var(--down); }

      /* Icons: the picture covers its text fallback once it loads. */
      .icon { position: relative; display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 6px; overflow: hidden; background: #24384a; flex: none; }
      .icon em { font: normal 600 11px/1.15 system-ui, sans-serif; color: var(--dim); text-align: center; padding: 2px; }
      .icon i { position: absolute; inset: 0; background: center / cover no-repeat; }
      .icon.mini { width: 22px; height: 22px; border-radius: 4px; vertical-align: middle; }
      .icon.mini em { font-size: 8px; }

      /* Bottom command panel. */
      .command {
        position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); display: flex; align-items: stretch; gap: 10px;
        padding: 8px 10px; background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; box-shadow: 0 6px 22px #000a;
        color: var(--text); font: 12px/1.3 system-ui, sans-serif; max-width: calc(100vw - 480px);
      }
      .command button { font: inherit; color: inherit; cursor: pointer; }
      .command .hero { display: flex; gap: 8px; align-items: center; }
      .command .portrait { position: relative; }
      .command .portrait .icon { width: 64px; height: 64px; border: 1px solid var(--edge-strong); }
      .command .portrait .lv {
        position: absolute; right: -4px; bottom: -4px; min-width: 20px; height: 20px; padding: 0 3px; border-radius: 10px; display: grid; place-items: center;
        background: #2b1c08; border: 1px solid var(--edge-strong); color: var(--gold); font-weight: 700; font-size: 12px;
      }
      .command .vitals { width: 190px; display: flex; flex-direction: column; gap: 3px; }
      .command .name { font-weight: 700; font-size: 14px; }
      .command .name small { margin-left: 6px; color: var(--dim); font-weight: 400; font-size: 11px; }
      .command .bar { position: relative; height: 14px; border-radius: 3px; background: #0008; overflow: hidden; border: 1px solid #0006; }
      .command .bar i { position: absolute; inset: 0 auto 0 0; transition: width 0.15s; }
      .command .bar.hp i { background: linear-gradient(180deg, #6fe27a, #2f9a3e); }
      .command .bar.xp { height: 10px; }
      .command .bar.xp i { background: linear-gradient(180deg, #b48cff, #6a43c9); }
      .command .bar span { position: relative; display: block; text-align: center; font-size: 10px; line-height: 14px; text-shadow: 0 1px 2px #000; }
      .command .bar.xp span { line-height: 10px; font-size: 9px; }
      .command .stats { display: flex; gap: 10px; color: var(--dim); font-size: 11px; }
      .command .skills, .command .items { display: flex; gap: 6px; align-items: flex-start; padding-left: 10px; border-left: 1px solid #ffffff14; }
      .command .items { display: grid; grid-template-columns: repeat(3, 40px); grid-auto-rows: 40px; gap: 4px; }
      .command .slot { position: relative; padding: 0; border: 1px solid #ffffff22; border-radius: 7px; background: #0006; }
      .command .skill { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; }
      .command .skill > button[data-cast] { position: relative; padding: 0; border: 1px solid var(--edge); border-radius: 7px; background: none; }
      .command .skill > button[data-cast]:hover:not([disabled]) { border-color: var(--edge-strong); box-shadow: 0 0 8px #e2bd7088; }
      .command .skill .icon { width: 52px; height: 52px; }
      .command .unlearned .icon { filter: grayscale(1) brightness(0.55); }
      .command .passive > button[data-cast] { border-style: dashed; cursor: help; }
      .command .dots { display: flex; gap: 2px; }
      .command .dots i { width: 5px; height: 5px; border-radius: 50%; background: #ffffff22; }
      .command .dots i.on { background: var(--gold); box-shadow: 0 0 3px var(--gold); }
      .command kbd { position: absolute; left: 3px; top: 2px; font: 700 10px monospace; color: #fff; text-shadow: 0 0 3px #000, 0 0 2px #000; }
      .command .cd {
        position: absolute; inset: 0; display: grid; place-items: center; border-radius: 6px; font-size: 16px; font-weight: 800; text-shadow: 0 1px 3px #000;
        background: conic-gradient(#000b calc(var(--p) * 1turn), #0003 0);
      }
      .command .learn {
        position: absolute; right: -7px; top: -9px; width: 22px; height: 22px; padding: 0; border-radius: 50%;
        border: 1px solid #b8ffbe; background: radial-gradient(circle at 35% 35%, #7de38a, #237a33); color: #fff; font-weight: 800; font-size: 14px; line-height: 1;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse { 50% { box-shadow: 0 0 10px #7dff8a; } }
      .command .item .icon { width: 38px; height: 38px; }
      .command .bought > button[data-cast] { border-color: #7dbdff88; }
      .command .charges { position: absolute; right: 2px; bottom: 1px; font: 700 10px monospace; color: var(--gold); text-shadow: 0 0 3px #000, 0 0 2px #000; }
      .command .item.empty { border-style: dashed; border-color: #ffffff18; }
      .command button.item:hover { border-color: var(--edge-strong); }
      .command button.item.active { border-color: #7dbdff88; }

      /* Selection info panel (replaces the command bar while a unit, building or shop is selected). */
      .command.hidden, .command.info { display: none; }
      .command.info.show { display: flex; flex-wrap: wrap; align-items: flex-start; width: min(860px, calc(100vw - 480px)); min-width: 420px; }
      .command.info .side.enemy { color: var(--down); } .command.info .side.neutral { color: #d8c8a0; } .command.info .side.friend { color: var(--up); }
      .command.info .bar.hp.foe i { background: linear-gradient(180deg, #ff8a6a, #b8321e); }
      .command.info .chips { display: flex; flex-wrap: wrap; gap: 3px; }
      .command.info .chips em { font-style: normal; font-size: 10px; padding: 1px 6px; border-radius: 8px; background: #ffffff14; color: #e8d8ff; }
      .command.info .statgrid { display: grid; grid-template-columns: repeat(2, minmax(110px, auto)); gap: 2px 14px; padding-left: 10px; border-left: 1px solid #ffffff14; align-content: start; }
      .command.info .statgrid div { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; }
      .command.info .statgrid span { color: var(--dim); }
      .command.info .loadout { display: flex; flex-direction: column; gap: 4px; padding-left: 10px; border-left: 1px solid #ffffff14; }
      .command.info .loadout div { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
      .command.info .loadout span:first-child { color: var(--dim); font-size: 11px; margin-right: 4px; }
      .command.info .loadout sub { font-size: 9px; color: var(--gold); margin-left: -6px; }
      .icon.small { width: 30px; height: 30px; border-radius: 5px; }
      .icon.small em { font-size: 8px; }
      .command.info .shop-head { display: flex; gap: 10px; align-items: center; width: 100%; }
      .command.info .shop-head > div:last-child { flex: 1; }
      .command.info .shop-head .icon { width: 48px; height: 48px; }
      .command.info .status { font-size: 12px; display: flex; align-items: center; gap: 8px; }
      .command.info .status .ok { color: var(--up); } .command.info .status .no { color: #ffb070; font-weight: 600; }
      .command.info .status button { padding: 2px 10px; border: 1px solid var(--edge-strong); border-radius: 5px; background: #2b1c08; color: var(--gold); font: inherit; cursor: pointer; }
      .command.info .goods { display: flex; flex-wrap: wrap; gap: 4px 12px; width: 100%; max-height: 36vh; overflow-y: auto; }
      .command.info .goods h4 { width: 100%; margin: 4px 0 0; font-size: 11px; color: var(--dim); letter-spacing: 1px; }
      .command.info .goods .grid { display: flex; flex-wrap: wrap; gap: 4px; }
      .command.info .tile { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 3px 3px 2px; border: 1px solid #ffffff1a; border-radius: 7px; background: #0005; color: inherit; font: inherit; cursor: pointer; }
      .command.info .tile .icon { width: 40px; height: 40px; }
      .command.info .tile b { font-size: 11px; color: var(--gold); }
      .command.info .tile:hover { border-color: var(--edge-strong); background: #2a3d50; }
      .command.info .tile.poor b { color: var(--down); }
      .command.info .tile.poor .icon, .command.info .tile.off .icon { filter: saturate(0.25) brightness(0.65); }
      .command.info .tile.off { cursor: not-allowed; }
      .command.info .tile.current { border-color: #7dff8a88; }
      .command.info .tile.mine { padding: 2px; }
      .shop-hint { position: fixed; left: 50%; bottom: 128px; transform: translateX(-50%); display: none; padding: 4px 12px; border-radius: 6px;
        background: #0b131ad8; border: 1px solid var(--edge); color: var(--text); font: 12px system-ui, sans-serif; pointer-events: none; }
      .shop-hint.show { display: block; }
      .shop-hint b { color: var(--gold); font-weight: 600; }

      /* Shop. */
      .shop {
        position: fixed; right: 10px; bottom: 120px; width: 312px; max-height: calc(100vh - 200px); overflow-y: auto; display: none;
        background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 8px 10px 10px; color: var(--text);
        font: 13px/1.35 system-ui, sans-serif; box-shadow: 0 6px 22px #000a;
      }
      .shop.show { display: block; }
      .shop nav { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
      .shop nav button, .shop nav span { padding: 3px 9px; border: 1px solid #ffffff1a; border-radius: 5px; background: #0005; color: var(--dim); font: inherit; font-size: 12px; cursor: pointer; }
      .shop nav .on { color: var(--gold); border-color: var(--edge-strong); background: #2b1c0888; }
      .shop h4 { margin: 8px 0 4px; font-size: 12px; color: var(--dim); font-weight: 600; letter-spacing: 1px; }
      .shop .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
      .shop .tile { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 3px 0 2px; border: 1px solid #ffffff1a; border-radius: 7px; background: #0005; color: inherit; font: inherit; cursor: pointer; }
      .shop .tile:hover { border-color: var(--edge-strong); background: #2a3d50; }
      .shop .tile b { font-size: 11px; color: var(--gold); }
      .shop .tile.poor b { color: var(--down); }
      .shop .tile.poor .icon { filter: saturate(0.3) brightness(0.7); }
      .shop .tile.current { border-color: #7dff8a88; }
      .shop .shop-hint { margin: 8px 0 0; color: var(--dim); font-size: 11px; }

      /* Tooltip. */
      .tooltip {
        position: fixed; left: 0; top: 0; z-index: 10; display: none; width: max-content; max-width: 290px; padding: 8px 10px; pointer-events: none;
        background: linear-gradient(180deg, #141f29f7, #0b131af7); border: 1px solid var(--edge-strong); border-radius: 7px; box-shadow: 0 6px 20px #000c;
        color: var(--text); font: 12px/1.45 system-ui, sans-serif;
      }
      .tooltip.show { display: block; }
      .tip-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
      .tip-head strong { font-size: 14px; color: #fff; }
      .tip-head .gold { color: var(--gold); font-weight: 700; }
      .tip-sub { color: var(--dim); font-size: 11px; margin-bottom: 4px; }
      .tip-row { display: flex; justify-content: space-between; gap: 16px; }
      .tip-row span { color: var(--dim); }
      .tip-row b { font-weight: 600; }
      .tip-row b.up { color: var(--up); } .tip-row b.up::after { content: ' ▲'; font-size: 9px; }
      .tip-row b.down { color: var(--down); } .tip-row b.down::after { content: ' ▼'; font-size: 9px; }
      .tip-text { margin: 5px 0 0; white-space: pre-line; color: #d6e2ea; }
      .tip-next { margin-top: 6px; padding-top: 5px; border-top: 1px solid #ffffff1a; color: var(--gold); font-weight: 600; font-size: 11px; }
      .tip-list, .tip-note { margin-top: 5px; color: var(--dim); font-size: 11px; }

      /* Main menu and loading. */
      .menu {
        position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; overflow: hidden;
        background: radial-gradient(ellipse at 50% 30%, #1d5a7a 0%, #0c2a3e 55%, #06131d 100%); color: var(--text);
        font: 14px system-ui, sans-serif; transition: opacity 0.4s;
      }
      .menu.leaving { opacity: 0; pointer-events: none; }
      .menu-ships { position: absolute; inset: auto 0 0 0; height: 30vh; display: flex; justify-content: center; gap: 2vw; opacity: 0.35; filter: saturate(0.8); mask-image: linear-gradient(transparent, #000 40%); }
      .menu-ships i { width: 12vw; max-width: 160px; aspect-ratio: 1; background: center / cover; border-radius: 16px; transform: translateY(30%); }
      .menu-card {
        position: relative; width: min(520px, calc(100vw - 32px)); padding: 26px 28px 20px; border-radius: 14px;
        background: var(--panel); border: 1px solid var(--edge); box-shadow: 0 20px 60px #000c;
      }
      .menu h1 { margin: 0 0 18px; text-align: center; font-size: 44px; font-weight: 900; letter-spacing: 6px; color: #ffe08a;
        text-shadow: 0 0 22px #ff9a2a88, 0 4px 0 #6b2a00; }
      .menu h1 small { display: block; margin-top: 4px; font-size: 13px; letter-spacing: 2px; color: var(--dim); text-shadow: none; font-weight: 500; }
      .menu-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 10px 0; }
      .menu-row > span { color: var(--dim); min-width: 64px; }
      .seg { display: flex; flex-wrap: wrap; gap: 4px; }
      .seg button { min-width: 44px; padding: 6px 12px; border: 1px solid #ffffff1f; border-radius: 6px; background: #0006; color: var(--text); font: inherit; cursor: pointer; }
      .seg button:hover { border-color: var(--edge-strong); }
      .seg button.on { background: #2b1c08; border-color: var(--edge-strong); color: var(--gold); font-weight: 700; }
      .menu-note { margin: 12px 0 0; color: var(--dim); font-size: 12px; line-height: 1.5; }
      .menu-actions, .settings-actions, .results-actions { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }
      .menu-actions button, .settings-actions button, .results-actions button {
        padding: 9px 20px; border: 1px solid #ffffff2a; border-radius: 8px; background: #0006; color: var(--text); font: 600 14px system-ui, sans-serif; cursor: pointer;
      }
      .menu-actions button.primary, .settings-actions button.primary, .results-actions button.primary {
        background: linear-gradient(180deg, #e6b65a, #b07a1f); border-color: #ffe08a; color: #2b1600; padding: 9px 30px;
      }
      .menu-help { display: none; margin: 14px 0 0; color: var(--dim); font-size: 12px; line-height: 1.7; }
      .menu.show-help .menu-help { display: block; }
      .menu-loading { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); width: min(420px, calc(100vw - 48px)); text-align: center; color: var(--dim); font-size: 12px; }
      .menu-bar { height: 6px; margin-bottom: 6px; border-radius: 3px; background: #0008; overflow: hidden; }
      .menu-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #b07a1f, #ffe08a); transition: width 0.2s; }
      .menu.loading .menu-card { display: none; }
      .menu.loading .menu-loading { bottom: 50%; font-size: 15px; color: var(--text); }
      .menu.loading .menu-loading::before { content: '正在驶入海域…'; display: block; margin-bottom: 14px; font-size: 26px; font-weight: 800; color: #ffe08a; }

      /* Settings. */
      .gear { position: fixed; left: 48px; top: 34px; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--edge); background: var(--panel); color: var(--text); cursor: pointer; font-size: 15px; }
      .settings { position: fixed; inset: 0; z-index: 30; display: none; place-items: center; background: #0008; font: 13px system-ui, sans-serif; color: var(--text); }
      .settings.show { display: grid; }
      .settings-card { width: min(420px, calc(100vw - 32px)); padding: 20px 24px; border-radius: 12px; background: var(--panel); border: 1px solid var(--edge); box-shadow: 0 16px 50px #000c; }
      .settings h2 { margin: 0 0 12px; font-size: 20px; color: var(--gold); text-align: center; }
      .settings section { margin: 12px 0; }
      .settings h3 { margin: 0 0 8px; font-size: 12px; color: var(--dim); font-weight: 600; letter-spacing: 1px; }
      .settings label { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
      .settings input[type=range] { flex: 1; accent-color: #e2bd70; }
      .settings .hint { margin: 6px 0 0; color: var(--dim); font-size: 11px; }

      /* Results. */
      .results { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; background: #000a; font: 13px system-ui, sans-serif; color: var(--text); animation: fadein 0.6s; }
      @keyframes fadein { from { opacity: 0; } }
      .results-card { width: min(860px, calc(100vw - 24px)); max-height: calc(100vh - 32px); overflow: auto; padding: 22px 26px; border-radius: 14px; background: var(--panel); border: 1px solid var(--edge); box-shadow: 0 20px 60px #000d; }
      .results h1 { margin: 0; text-align: center; font-size: 52px; font-weight: 900; letter-spacing: 8px; }
      .results.won h1 { color: #ffe08a; text-shadow: 0 0 24px #ff9a2a, 0 4px 0 #6b2a00; }
      .results.lost h1 { color: #ff8a7a; text-shadow: 0 0 24px #a02a1a, 0 4px 0 #3a0b0b; }
      .results-sub { margin: 4px 0 12px; text-align: center; color: var(--dim); }
      .results h3 { margin: 12px 0 4px; font-size: 14px; }
      .results .south { color: var(--south); } .results .north { color: var(--north); }
      .results table { width: 100%; border-collapse: collapse; }
      .results th { text-align: left; color: var(--dim); font-weight: 500; font-size: 11px; padding: 3px 6px; }
      .results td { padding: 4px 6px; border-top: 1px solid #ffffff0f; white-space: nowrap; }
      .results tr.me td { background: #e2bd7018; }
      .results td.ship .icon { margin-right: 6px; }
      .results .mvp { padding: 1px 5px; border-radius: 4px; background: #b07a1f; color: #2b1600; font-size: 10px; }

      /* Volume control. */
      .volume { position: fixed; left: 12px; top: 34px; font: 12px system-ui, sans-serif; color: var(--text); }
      .volume .speaker { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--edge); background: var(--panel); cursor: pointer; font-size: 14px; }
      .volume-panel { display: none; margin-top: 6px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; }
      .volume.open .volume-panel { display: grid; gap: 6px; }
      .volume-panel label { display: flex; align-items: center; gap: 8px; }
      .volume-panel input[type=range] { width: 120px; accent-color: #e2bd70; }

      /* Kill feed and announcements. */
      .killfeed { position: fixed; right: 12px; top: 56px; display: flex; flex-direction: column; gap: 3px; align-items: flex-end; pointer-events: none; font: 12px system-ui, sans-serif; }
      .killfeed div { padding: 3px 9px; border-radius: 5px; background: #0b131ad0; border: 1px solid #ffffff14; color: var(--text); transition: opacity 1s; }
      .killfeed div.old { opacity: 0; }
      .killfeed .south { color: var(--south); } .killfeed .north { color: var(--north); }
      .announce {
        position: fixed; left: 50%; top: 22%; transform: translate(-50%, -50%) scale(0.8); opacity: 0; pointer-events: none; text-align: center;
        transition: opacity 0.25s, transform 0.25s cubic-bezier(.2,1.6,.4,1); font-family: system-ui, sans-serif;
      }
      .announce.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      .announce strong { display: block; font-size: 38px; font-weight: 900; letter-spacing: 2px; color: #ffe08a; text-shadow: 0 0 18px #ff9a2a, 0 3px 0 #6b2a00, 0 0 4px #000; }
      .announce.south strong { color: #bfe0ff; text-shadow: 0 0 18px #3f7fe0, 0 3px 0 #0b2a5a, 0 0 4px #000; }
      .announce.north strong { color: #ffd0c8; text-shadow: 0 0 18px #e0483c, 0 3px 0 #5a0b0b, 0 0 4px #000; }
      .announce small { display: block; margin-top: 4px; font-size: 14px; color: #fff; text-shadow: 0 1px 3px #000; }

      /* Scoreboard (hold Tab). */
      .scoreboard {
        position: fixed; left: 50%; top: 60px; transform: translateX(-50%); display: none; padding: 10px 16px 14px; min-width: 640px;
        background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; box-shadow: 0 8px 30px #000c; color: var(--text);
        font: 13px system-ui, sans-serif; pointer-events: none;
      }
      .scoreboard.show { display: block; }
      .scoreboard h3 { margin: 6px 0 4px; font-size: 14px; }
      .scoreboard table { width: 100%; border-collapse: collapse; }
      .scoreboard th { text-align: left; color: var(--dim); font-weight: 500; font-size: 11px; padding: 2px 6px; }
      .scoreboard td { padding: 3px 6px; border-top: 1px solid #ffffff0f; }
      .scoreboard tr.me td { background: #e2bd7018; }
      .scoreboard td.ship .icon { margin-right: 6px; }
      .scoreboard td.items .icon { margin-right: 2px; }
      /* Narrow windows: smaller minimap, the command panel beside it, the shop above. */
      @media (max-width: 1100px) {
        .minimap { width: 150px; height: 150px; }
        .command, .command.info.show { left: 170px; right: 8px; transform: none; width: auto; min-width: 0; max-width: none; flex-wrap: wrap; gap: 6px; }
        .command .skills, .command .items { padding-left: 0; border-left: 0; }
        .shop { bottom: 230px; width: min(312px, calc(100vw - 20px)); max-height: calc(100vh - 300px); }
        .scoreboard { min-width: 0; width: calc(100vw - 40px); font-size: 11px; }
        #help { display: none; }
      }
      .repair {
        position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); display: none; padding: 8px 16px;
        border: 1px solid #5cff7a88; border-radius: 6px; background: #12301ce6; color: #c8ffd2; font: 14px system-ui, sans-serif; cursor: pointer;
      }
      .repair.show { display: block; }
      .target-hint {
        position: fixed; left: 50%; top: 52px; transform: translateX(-50%); display: none; padding: 6px 14px; border-radius: 6px;
        background: #1d3b5ccc; color: #fff; font: 14px system-ui, sans-serif; pointer-events: none;
      }
      .target-hint.show { display: block; }
      body.targeting canvas { cursor: crosshair; }
      .selection-box {
        position: fixed; display: none; pointer-events: none;
        border: 1px solid #7dff8a; background: #7dff8a22;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" class="panel"></div>
    <div id="help" class="panel">左键选择 · 右键航行 · 方向键 / 边缘 / 中键平移 · 滚轮缩放
技能快捷键见技能图标 · 1–6 物品 · 按住 Tab 查看战况 · 空格回到船只 · F10 设置</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
