<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOOM 海战</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1d2a; overflow: hidden; user-select: none; }
      #app { position: fixed; inset: 0; }
      .panel {
        position: fixed; font: 13px/1.5 system-ui, sans-serif; color: #e6f1f7;
        text-shadow: 0 1px 2px #000a; pointer-events: none; white-space: pre;
      }
      #hud { left: 12px; top: 10px; }
      #help { right: 12px; top: 10px; text-align: right; opacity: 0.85; }
      #info { left: 252px; bottom: 16px; }
      .minimap {
        position: fixed; left: 12px; bottom: 12px; width: 220px; height: 220px;
        border: 2px solid #0008; border-radius: 4px; cursor: pointer;
      }
      .overlay { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .status { left: 50%; top: 10px; transform: translateX(-50%); font-size: 15px; background: #0008; padding: 4px 12px; border-radius: 6px; }
      .toast {
        position: fixed; left: 50%; top: 52px; transform: translateX(-50%); padding: 6px 14px; border-radius: 6px;
        background: #a33c; color: #fff; font: 14px system-ui, sans-serif; opacity: 0; transition: opacity 0.2s; pointer-events: none;
      }
      .toast.show { opacity: 1; }
      .banner {
        position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); display: none; padding: 18px 36px;
        border-radius: 10px; font: bold 30px system-ui, sans-serif; color: #fff; background: #000b;
      }
      .banner.show { display: block; }
      .banner.win { color: #ffd84a; }
      .banner.lose { color: #ff7a6a; }
      .shop {
        position: fixed; right: 12px; bottom: 12px; width: 300px; max-height: 70vh; overflow-y: auto; display: none;
        background: #101820e6; border: 1px solid #fff2; border-radius: 8px; padding: 8px; color: #e6f1f7;
        font: 13px/1.35 system-ui, sans-serif;
      }
      .shop.show { display: block; }
      .shop h4 { margin: 8px 2px 4px; font-size: 13px; color: #9cc3d8; }
      .shop button {
        display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; margin: 2px 0;
        padding: 5px 8px; border: 1px solid #fff1; border-radius: 5px; background: #1d2a36; color: inherit;
        font: inherit; text-align: left; cursor: pointer;
      }
      .shop button:hover:not([disabled]) { background: #2a3d50; }
      .shop button[disabled] { opacity: 0.45; cursor: default; }
      .shop button.inert { opacity: 0.55; }
      .shop small { display: block; color: #9ab; font-size: 11px; }
      .shop b { color: #ffd84a; font-weight: 600; }
      .shop b.poor { color: #c66; }
      .inventory { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
      .inventory button, .inventory .empty { min-height: 34px; margin: 0; font-size: 12px; }
      .inventory .empty { border: 1px dashed #fff2; border-radius: 5px; }
      .repair {
        position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); display: none; padding: 8px 16px;
        border: 1px solid #5cff7a88; border-radius: 6px; background: #12301ce6; color: #c8ffd2; font: 14px system-ui, sans-serif; cursor: pointer;
      }
      .repair.show { display: block; }
      .selection-box {
        position: fixed; display: none; pointer-events: none;
        border: 1px solid #7dff8a; background: #7dff8a22;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" class="panel"></div>
    <div id="help" class="panel">左键选择 / 拖动框选 · 右键航行
方向键、WASD、屏幕边缘或中键拖动平移 · 滚轮缩放
空格或 H 回到所选船只 · 点击小地图跳转</div>
    <div id="info" class="panel"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
